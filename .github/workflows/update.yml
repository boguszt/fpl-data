name: FPL update

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      FPL_PLSTATS: ${{ github.event.schedule == '0 6 * * *' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync and update
        run: |
          uv sync --frozen
          uv run python ingest/update.py
      - name: Commit raw snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw
          if git diff --cached --quiet; then
            echo "no raw changes"
          else
            git commit -m "chore: fpl raw snapshots"
            git push
          fi
      - name: Rebuild marts from raw
        run: uv run python -m transform.build
      - name: Export web JSON
        run: uv run python -m transform.export_web
      - name: Commit web data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/*.json
          if git diff --cached --quiet; then
            echo "no web data changes"
            exit 0
          fi
          echo "staged web/data files:"
          total=0
          while IFS= read -r f; do
            size=$(git cat-file -s ":$f")
            printf '  %s  %s bytes\n' "$f" "$size"
            total=$((total + size))
          done < <(git diff --cached --name-only -- web/data)
          echo "staged web/data total: ${total} bytes"
          limit=$((30 * 1024 * 1024))
          if [ "$total" -gt "$limit" ]; then
            echo "web/data staged size exceeds 30 MB (${total} bytes). Refusing to commit — this looks like a match-log rewrite leak, not a normal gameweek."
            exit 1
          fi
          git commit -m "chore: web player-table json"
          git push
