name: FPL update

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync and update
        run: |
          uv sync --frozen
          uv run python ingest/update.py
      - name: Commit raw snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw
          if git diff --cached --quiet; then
            echo "no raw changes"
          else
            git commit -m "chore: fpl raw snapshots"
            git push
          fi
      - name: Rebuild marts from raw
        run: uv run python -m transform.build
      - name: Export web JSON
        run: uv run python -m transform.export_web
      - name: Commit web data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/*.json
          if git diff --cached --quiet; then
            echo "no web data changes"
          else
            git commit -m "chore: web player-table json"
            git push
          fi
