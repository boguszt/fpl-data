<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player table — fpl-data</title>
<style>
:root{
  --paper:#fff; --obs:#fafbfc; --der:#f0f6f8; --fpl:#f9f6fc; --fpl-der:#f3edfa;
  --ink:#15181d; --ink-2:#5d6675; --ink-3:#97a0ad;
  --rule:#e6e9ee; --rule-2:#ccd2db; --rule-3:#8e97a4;
  --g-att:#12705a; --g-att-bg:#e3f2ed; --g-att-br:#9dc9bb;
  --g-def:#1c5486; --g-def-bg:#e3edf7; --g-def-br:#a3c1de;
  --g-gk:#8a5416;  --g-gk-bg:#f8eddc;  --g-gk-br:#dcbe92;
  --g-fpl:#68409c; --g-fpl-bg:#efe8f8; --g-fpl-br:#c0a8dd;
  --g-dis:#9c3f3f; --g-dis-bg:#f7e7e7; --g-dis-br:#dcaeae;
  --pa:#17679f; --pa-soft:#cfe2f0;
  --pb:#b35c12; --pb-soft:#f5ddc2;
  --warn:#8a5a12; --warn-soft:#fdf4e3;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --num:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --row:31px; --h1:23px; --h2:27px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}

.masthead{display:flex;align-items:baseline;gap:14px;padding:10px 16px 9px;
  border-bottom:1px solid var(--rule-2)}
.masthead h1{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.masthead .sub{color:var(--ink-3);font-size:12px}
.masthead .spacer{flex:1}
.bellwrap{position:relative;display:inline-block;margin-left:2px}
.bell{position:relative;width:24px;height:24px;border:1px solid var(--rule-2);
  background:var(--paper);border-radius:4px;cursor:pointer;color:var(--ink-3);
  padding:0;line-height:1}
.bell:hover{border-color:var(--rule-3);color:var(--ink)}
.bico{font-size:12px}
.bdot{position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;
  background:var(--warn);border:1.5px solid var(--paper)}
.bellpanel{position:absolute;top:28px;right:0;width:300px;background:var(--paper);
  border:1px solid var(--rule-2);border-radius:5px;box-shadow:0 8px 26px rgba(20,24,30,.14);
  display:none;z-index:60;overflow:hidden}
.bellpanel.on{display:block}
.bhead{padding:8px 11px 6px;border-bottom:1px solid var(--rule);font-size:12px;
  font-weight:600;display:flex;align-items:baseline;gap:8px}
.bgw{font-weight:400;color:var(--ink-3);font-size:11px;margin-left:auto}
.brow{display:flex;align-items:baseline;gap:8px;padding:5px 11px;font-size:11.5px;
  border-bottom:1px solid var(--rule)}
.bk{flex:1;color:var(--ink-2);display:flex;flex-direction:column}
.bn{font-size:9.5px;color:var(--ink-3)}
.bv{font-family:var(--num);font-size:11px;color:var(--ink-3);white-space:nowrap}
.brow.stale .bv{color:var(--warn);font-weight:600}
.brow.stale .bk{color:var(--warn)}
.bnote{padding:7px 11px;font-size:10.5px;line-height:1.5;color:var(--ink-2);
  background:var(--obs);border-bottom:1px solid var(--rule)}
.bmsg{padding:10px 11px;font-size:11px;line-height:1.5;color:var(--ink-3)}
.bmsg code{font-family:var(--num);color:var(--ink-2)}
.bfoot{display:flex;align-items:center;gap:8px;padding:6px 11px;font-size:10.5px;
  color:var(--ink-3);background:var(--obs)}
.bfoot button{margin-left:auto;border:1px solid var(--rule-2);background:var(--paper);
  border-radius:3px;padding:1px 8px;cursor:pointer;font-size:10.5px;color:var(--ink-2)}
.bfoot button:hover{border-color:var(--rule-3);color:var(--ink)}
.freshness{font-size:11.5px;color:var(--ink-3);cursor:pointer;background:none;border:0;
  padding:2px 4px;border-radius:3px}
.freshness:hover{color:var(--ink-2);background:var(--obs)}
.freshness.warn{color:var(--warn)}
.banner{padding:7px 16px;font-size:12px;background:var(--warn-soft);color:var(--warn);
  border-bottom:1px solid #f0e2c4}
.banner[hidden]{display:none}

.controls{border-bottom:1px solid var(--rule-2)}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;padding:9px 16px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;color:var(--ink-3)}
.field select{height:26px;padding:0 6px;border:1px solid var(--rule-2);border-radius:3px;
  background:var(--paper);min-width:108px;font-size:12.5px}
.txtin{height:26px;padding:0 8px;border:1px solid var(--rule-2);border-radius:3px;
  background:var(--paper);width:150px;font-size:12.5px;outline:none}
.txtin:focus{border-color:var(--ink-3)}
.preset{border:1px solid var(--rule-2);background:var(--paper);color:var(--ink-2);
  border-radius:4px;padding:2px 9px;cursor:pointer;font-size:11.5px}
.preset:hover{border-color:var(--rule-3);color:var(--ink)}
.preset[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.preset.ghost{border-style:dashed}
.preset.loading{opacity:.5}
.presets .spacer{flex:1}
.chip.sel{display:inline-flex;align-items:center;max-width:132px}
.chip.sel .cl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.more{background:var(--obs);border-color:var(--rule-2);color:var(--ink-2);
  font-family:var(--num);font-size:11px}
.chip.more:hover{border-color:var(--rule-3);color:var(--ink)}
.chips{max-width:none}
.chip.sel .x{margin-left:5px;color:var(--ink-3);font-size:12px;flex:none}
.chip.sel:hover .x{color:var(--ink)}
.viewpanel{width:250px}
.vrow{display:flex;align-items:center;gap:4px;padding:1px 4px 1px 9px}
.vrow:hover{background:var(--obs)}
.vname{flex:1;min-width:0;border:0;background:none;text-align:left;cursor:pointer;
  font:inherit;font-size:12.5px;color:var(--ink);padding:4px 0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.vdel{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:14px;
  line-height:1;padding:0 5px;border-radius:3px}
.vdel:hover{color:#9c3f3f;background:var(--paper)}
.vsave{display:flex;gap:5px;padding:7px 8px;border-top:1px solid var(--rule);
  background:var(--obs)}
.vsave input{flex:1;min-width:0;height:24px;padding:0 7px;border:1px solid var(--rule-2);
  border-radius:3px;font-size:12px;outline:none;background:var(--paper)}
.vsave input:focus{border-color:var(--ink-3)}
.vsave button{border:1px solid var(--rule-2);background:var(--paper);border-radius:3px;
  padding:0 10px;cursor:pointer;font-size:11.5px;color:var(--ink-2)}
.vsave button:hover{border-color:var(--rule-3);color:var(--ink)}
#fViews .ms-btn{min-width:98px}
.pickwrap{position:relative;display:inline-block;margin-left:4px}
.pickpre{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:6px 8px;
  border-bottom:1px solid var(--rule);background:var(--obs)}
.prelbl{font-size:9.5px;color:var(--ink-3);letter-spacing:.04em;margin-right:2px}
.pickpre button{border:1px solid var(--rule-2);background:var(--paper);color:var(--ink-2);
  border-radius:4px;padding:1px 8px;cursor:pointer;font-size:11px}
.pickpre button:hover{border-color:var(--rule-3);color:var(--ink)}
.pickpre button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.jump.plain.dense{font-size:11px;padding:2px 9px;margin-right:2px}
.pickpanel{top:calc(100% + 4px);left:auto;right:0;width:330px;
  position:absolute;z-index:40}
.pickfam{display:flex;gap:2px;flex-wrap:wrap;padding:5px 8px;
  border-bottom:1px solid var(--rule)}
.pickfam button{border:0;background:none;padding:1px 7px;border-radius:9px;
  cursor:pointer;font-size:10.5px;color:var(--ink-3)}
.pickfam button:hover{color:var(--ink-2)}
.pickfam button[aria-pressed=true]{background:var(--ink);color:#fff}
.pickgrp{padding:5px 9px 2px;font-size:9.5px;letter-spacing:.04em;color:var(--ink-3);
  font-weight:600}
.pickcount{flex:1;font-size:11px;color:var(--ink-3);line-height:24px}
.pickpanel .ms-list{max-height:280px}
.range2{display:flex;align-items:center;gap:5px}
.range2 input{width:52px;height:26px;padding:0 6px;border:1px solid var(--rule-2);
  border-radius:3px;background:var(--paper);font-size:12.5px;font-family:var(--num);outline:none}
.range2 span{color:var(--ink-3);font-size:12px}

/* average row */
tbody tr.avg td{position:sticky;top:calc(var(--h1) + var(--h2));z-index:2;
  background:#eef1f4;border-bottom:1px solid var(--rule-3);color:var(--ink-2);
  font-weight:500;height:28px}
tbody tr.avg td.name{z-index:5;background:#eef1f4;font-family:var(--ui)}
tbody tr.avg:hover td{filter:none}

/* pinned rows */
tbody tr.pinned td{background:#fdf8e8}
tbody tr.pinned td.name{background:#fdf8e8}
tbody tr.pinned.last td{border-bottom:1px solid var(--rule-3)}
.pin{border:0;background:none;cursor:pointer;color:var(--ink-3);padding:0 4px 0 0;
  font-size:12px;line-height:1;opacity:0}
tbody tr:hover .pin,.pin.on{opacity:1}
.pin.on{color:#b8860b}
.pin:hover{color:var(--ink)}
.field select[multiple]{height:auto;padding:3px 4px;min-width:126px}

/* position toggles */
.posrow{display:flex;gap:4px}
.pos-b{height:26px;padding:0 10px;border:1px solid var(--rule-2);background:var(--paper);
  border-radius:3px;cursor:pointer;font-size:12px;color:var(--ink-3);font-family:var(--num)}
.pos-b:hover{border-color:var(--rule-3);color:var(--ink)}
.pos-b[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* checkbox dropdown */
.ms{position:relative}
.ms-btn{height:26px;padding:0 8px;border:1px solid var(--rule-2);background:var(--paper);
  border-radius:3px;cursor:pointer;font-size:12.5px;color:var(--ink-2);display:flex;
  align-items:center;gap:6px;min-width:120px;justify-content:space-between}
.ms-btn:hover{border-color:var(--rule-3);color:var(--ink)}
.ms-btn.active{border-color:var(--ink-3);color:var(--ink)}
.ms-btn .cnt{background:var(--ink);color:#fff;border-radius:9px;padding:0 6px;font-size:10.5px;
  line-height:15px;font-family:var(--num)}
.ms-btn .car{color:var(--ink-3);font-size:10px}
.ms-panel{position:absolute;top:29px;left:0;z-index:30;width:246px;background:var(--paper);
  border:1px solid var(--rule-2);border-radius:4px;box-shadow:0 6px 22px rgba(20,24,30,.13);
  display:none;overflow:hidden}
.ms-panel.on{display:block}
.ms-search{width:100%;height:28px;border:0;border-bottom:1px solid var(--rule);padding:0 9px;
  font-size:12.5px;outline:none}
.ms-list{max-height:236px;overflow:auto;padding:3px 0}
.ms-opt{display:flex;align-items:center;gap:7px;padding:3px 9px;cursor:pointer;font-size:12.5px}
.ms-opt:hover{background:var(--obs)}
.ms-opt input{margin:0;accent-color:var(--ink);width:13px;height:13px}
.ms-opt .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-foot{display:flex;gap:6px;padding:6px 8px;border-top:1px solid var(--rule);background:var(--obs)}
.ms-foot button{flex:1;height:24px;border:1px solid var(--rule-2);background:var(--paper);
  border-radius:3px;cursor:pointer;font-size:11.5px;color:var(--ink-2)}
.ms-foot button:hover{border-color:var(--rule-3);color:var(--ink)}
.ms-none{padding:9px;color:var(--ink-3);font-size:12px}
.range{display:flex;align-items:center;gap:5px}
.range span{color:var(--ink-3);font-size:12px}
.minutes{display:flex;align-items:center;gap:8px}
.minutes input[type=range]{width:112px;accent-color:var(--g-att)}
.minutes .val{font-family:var(--num);font-size:12px;min-width:34px}
.clear{height:26px;padding:0 9px;border:1px solid var(--rule-2);background:var(--paper);
  border-radius:3px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.clear:hover{border-color:var(--rule-3);color:var(--ink)}

/* tab strip */
.tabs{display:flex;align-items:center;gap:2px;padding:0 16px;border-top:1px solid var(--rule)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 11px;
  cursor:pointer;color:var(--ink-3);font-size:12.5px;font-weight:500;display:flex;
  align-items:center;gap:6px}
.tab:hover{color:var(--ink-2)}
.tab .dot{width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.55}
.tab[aria-selected=true]{color:var(--ink)}
.tab[aria-selected=true] .dot{opacity:1}
.tab.t-att[aria-selected=true]{border-bottom-color:var(--g-att);color:var(--g-att)}
.tab.t-def[aria-selected=true]{border-bottom-color:var(--g-def);color:var(--g-def)}
.tab.t-gk[aria-selected=true]{border-bottom-color:var(--g-gk);color:var(--g-gk)}
.tab.t-fpl[aria-selected=true]{border-bottom-color:var(--g-fpl);color:var(--g-fpl)}
.tab.t-dis[aria-selected=true]{border-bottom-color:var(--g-dis);color:var(--g-dis)}
.tab.t-all[aria-selected=true]{border-bottom-color:var(--ink)}
.tab.t-all .dot{display:none}
.tabs .spacer{flex:1}

/* frame switcher */
.frames{display:flex;align-items:center;gap:8px;padding:8px 16px 9px}
.frames .lbl{font-size:11px;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:4px;overflow:hidden}
.seg button{background:var(--paper);border:0;border-right:1px solid var(--rule-2);
  padding:3px 10px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--obs);color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.frames .chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--rule-2);background:var(--paper);color:var(--ink-3);padding:2px 9px;
  border-radius:11px;cursor:pointer;font-size:12px;white-space:nowrap}
.chip:hover{border-color:var(--rule-3);color:var(--ink)}
.chip[aria-pressed=true]{color:var(--ink-2)}
.c-att[aria-pressed=true]{background:var(--g-att-bg);border-color:var(--g-att-br);color:var(--g-att);font-weight:500}
.c-def[aria-pressed=true]{background:var(--g-def-bg);border-color:var(--g-def-br);color:var(--g-def);font-weight:500}
.c-gk[aria-pressed=true]{background:var(--g-gk-bg);border-color:var(--g-gk-br);color:var(--g-gk);font-weight:500}
.c-fpl[aria-pressed=true]{background:var(--g-fpl-bg);border-color:var(--g-fpl-br);color:var(--g-fpl);font-weight:500}
.c-dis[aria-pressed=true]{background:var(--g-dis-bg);border-color:var(--g-dis-br);color:var(--g-dis);font-weight:500}
.chip.toggle[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.rankbtn{margin-left:2px}

.tablewrap{flex:1;overflow:auto;position:relative}
table{border-collapse:separate;border-spacing:0;font-size:12.5px}
thead th{position:sticky;background:var(--paper);z-index:3;font-weight:500;text-align:right;
  padding:0 9px;border-bottom:1px solid var(--rule-2)}
thead tr.labels th{white-space:normal;line-height:1.2;vertical-align:bottom;
  padding-bottom:4px;width:66px;min-width:66px;max-width:66px;
  overflow:hidden;text-overflow:ellipsis}
thead tr.labels th.name{width:auto;min-width:0;max-width:none}
thead tr.labels th.frz{max-width:none}
tbody td{width:66px;min-width:66px;max-width:66px}
tbody td.name,tbody td.txt{width:auto;min-width:0;max-width:none}
tbody td.frz{max-width:none}
table{table-layout:fixed}
thead tr.blocks th{white-space:nowrap}
thead tr.blocks th{top:0;height:var(--h1);font-size:11px;font-weight:600;text-align:left;
  border-bottom:1px solid var(--rule);color:var(--ink-2)}
thead tr.labels th{top:var(--h1);height:var(--h2);color:var(--ink-2);cursor:help;
  border-bottom:1px solid var(--rule-2)}
:root{--h2:34px}
body.dense{--h2:28px}
thead th.obs{background:var(--obs)} thead th.der{background:var(--der)}
thead th.obs.fplcol{background:var(--fpl)} thead th.der.fplcol{background:var(--fpl-der)}
thead tr.labels th:hover{color:var(--ink)}
thead tr.labels th.sorted{font-weight:600}
thead tr.labels th.sorted.k-att{box-shadow:inset 0 -2px 0 var(--g-att);color:var(--g-att)}
thead tr.labels th.sorted.k-def{box-shadow:inset 0 -2px 0 var(--g-def);color:var(--g-def)}
thead tr.labels th.sorted.k-gk{box-shadow:inset 0 -2px 0 var(--g-gk);color:var(--g-gk)}
thead tr.labels th.sorted.k-fpl{box-shadow:inset 0 -2px 0 var(--g-fpl);color:var(--g-fpl)}
thead tr.labels th.sorted.k-dis{box-shadow:inset 0 -2px 0 var(--g-dis);color:var(--g-dis)}
thead tr.labels th.sorted.k-base{box-shadow:inset 0 -2px 0 var(--ink);color:var(--ink)}
th.name,td.name{position:sticky;left:0;z-index:4;text-align:left;border-right:1px solid var(--rule-2)}
thead th.name{z-index:5;background:var(--paper)}
.keystrip{display:flex;align-items:center;gap:5px 14px;flex-wrap:wrap;padding:5px 16px;
  border-bottom:1px solid var(--rule);font-size:11px;color:var(--ink-3)}
.keystrip.empty{display:none}
.keytog{border:1px solid var(--rule-2);background:var(--paper);color:var(--ink-3);
  border-radius:3px;padding:1px 8px;cursor:pointer;font-size:10.5px}
.keytog:hover{border-color:var(--rule-3);color:var(--ink)}
.keytog[aria-pressed=true]{background:var(--obs)}
.keyitem{cursor:help;white-space:nowrap}
.keyitem b{font-family:var(--num);color:var(--ink-2);font-weight:600;margin-right:5px}
.jumpbar{display:flex;align-items:center;gap:5px;padding:6px 16px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule)}
.jumpbar.empty{display:none}
.jumpbar .spacer{flex:1}
.jump{border:0;background:var(--obs);color:var(--ink-2);border-radius:9px;
  padding:2px 9px;cursor:pointer;font-size:11px}
.jump:hover{color:var(--ink)}
.jump.c-att{background:var(--g-att-bg);color:var(--g-att)}
.jump.c-def{background:var(--g-def-bg);color:var(--g-def)}
.jump.c-gk{background:var(--g-gk-bg);color:var(--g-gk)}
.jump.c-dis{background:var(--g-dis-bg);color:var(--g-dis)}
.jump.c-fpl{background:var(--g-fpl-bg);color:var(--g-fpl)}
.jump.c-pas{background:var(--g-pas-bg);color:var(--g-pas)}
.jump.c-ter{background:var(--g-ter-bg);color:var(--g-ter)}
.jump.c-due{background:var(--g-due-bg);color:var(--g-due)}
.jump.plain{border:1px solid var(--rule-2);background:var(--paper)}
.jump.plain[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* frozen identity block */
th.frz,td.frz{position:sticky;z-index:4;background:var(--paper);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
thead th.frz{z-index:6}
th.frzend,td.frzend{border-right:2px solid var(--rule-3)}
thead th.frzspan{position:sticky;left:0;z-index:6;background:var(--paper)}
tbody tr:hover td.frz{background:#f6f8fa}
tbody tr.avg td.frz{background:#eef1f4;z-index:5}
tbody tr.pinned td.frz{background:#fdf8e8;z-index:4}
.tablewrap{scroll-behavior:auto;position:relative}
.tablewrap.more::after{content:'';position:sticky;right:0;top:0;float:right;
  width:26px;height:100%;pointer-events:none;
  background:linear-gradient(to right,rgba(255,255,255,0),rgba(255,255,255,.92))}

/* compact density */
body.dense{--row:25px;--h1:19px;--h2:22px}
body.dense tbody td{padding:0 6px;font-size:11.5px}
body.dense thead th{padding:0 6px;font-size:11px}
body.dense .trk{font-size:9px}
thead tr.blocks th.fam{text-align:center;font-size:9.5px;letter-spacing:.05em;
  font-weight:600;text-transform:uppercase}
thead tr.blocks th.fam.k-att{background:var(--g-att-bg);color:var(--g-att)}
thead tr.blocks th.fam.k-def{background:var(--g-def-bg);color:var(--g-def)}
thead tr.blocks th.fam.k-gk{background:var(--g-gk-bg);color:var(--g-gk)}

.simval{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11.5px;
  color:var(--ink-2);width:24px;text-align:right;flex:none}
.simval.faint{color:var(--ink-3)}
.simval.faint::after{content:'\2193';font-size:8px;margin-left:1px}
.simval.vivid::after{content:'\2191';font-size:8px;margin-left:1px}
.sval.r{text-align:right}
.srow2 .sval:last-child{text-align:left}
.srow2 .sval:last-child .srk{margin:0 0 0 3px}
.sval.dim{color:var(--ink-3)}
.sval.lead{font-weight:600;color:var(--ink)}
.strack{flex:1;height:11px;background:#eceff3;border-radius:2px;overflow:hidden}
.sfill{display:block;height:11px;background:var(--pa);border-radius:2px}
.split{flex:1;min-width:60px;height:13px;border-radius:3px;overflow:hidden;display:flex;
  background:#eceff3}
.split .pa{background:var(--pa)}
.split .pb{flex:1;background:var(--pb);border-left:1px solid var(--paper)}
.chip{min-width:30px;flex:none;text-align:center;border-radius:4px;font-size:11px;
  line-height:17px;padding:0 4px;color:var(--ink-2);background:#eceff3;
  font-variant-numeric:tabular-nums}
.chip.b4{background:#cfe8dc;color:#0e5d4a}
.chip.b3{background:#e3f0e6;color:#2f6b48}
.chip.b2{background:#f7efd9;color:#8a6410}
.chip.b1{background:#f8e4d5;color:#9a5418}
.chip.b0{background:#f7dcdc;color:#98302f}
.chip.na{color:var(--ink-3)}
.radarsec .radar{max-width:260px}

.dpanes .pane.a h2::before,.dpanes .pane.b h2::before{content:"";display:inline-block;
  width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dpanes .pane.a h2::before{background:var(--pa)}
.dpanes .pane.b h2::before{background:var(--pb)}
.cmpms{display:inline-block}
.cmpms .ms-btn{min-width:170px;height:24px;font-size:12px}
.cmpms .ms-panel{width:300px}
.pbtn{width:100%;border:0;background:none;text-align:left;font:inherit}
.pbtn .pmeta{font-family:var(--num);font-size:10.5px;color:var(--ink-3);margin-left:auto;
  padding-left:8px;white-space:nowrap}
.ms-opt .lbl{flex:0 1 auto}
.dhead{position:relative}
.dpanes{display:flex;gap:0}
.pane{display:flex;gap:10px;align-items:center}
.pane h2{font-size:16px}
.dpanes .pane h2{font-size:15px}
.cmpchip.clear{color:var(--ink-3)}
.dsum{font-size:11px;font-weight:600;cursor:pointer;list-style:none;user-select:none;
  padding:7px 2px;display:flex;align-items:center;gap:6px}
.dsum::-webkit-details-marker{display:none}
.dsum::before{content:"\25B8";font-size:9px;color:var(--ink-3);transition:transform .12s;
  display:inline-block}
details[open]>.dsum::before{transform:rotate(90deg)}
details.dsec{border-bottom:1px solid var(--rule);margin-top:0}
details.dsec[open]{padding-bottom:9px}
.dsec.s-att .dsum{color:var(--g-att)} .dsec.s-def .dsum{color:var(--g-def)}
.dsec.s-gk .dsum{color:var(--g-gk)}   .dsec.s-fpl .dsum{color:var(--g-fpl)}
.dsec.s-dis .dsum{color:var(--g-dis)}
.rtoggle{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:8px}
.rseg button{padding:3px 11px}
.rhelp{display:inline-block;width:15px;height:15px;border-radius:50%;border:1px solid var(--rule-2);
  background:var(--paper);color:var(--ink-3);font-size:10px;line-height:1;cursor:help;
  margin-left:7px;padding:0;font-family:var(--ui);text-align:center;
  line-height:13px;vertical-align:1px}
.rhelp:hover{border-color:var(--ink-3);color:var(--ink)}
.dsec h3{align-items:center}
/* compare */
.clbl{font-size:11px;color:var(--ink-3)}
.clbl.dim{font-style:italic}
.cmpchip{font-size:11.5px;padding:1px 8px}
.cmpchip[aria-pressed=true]{background:#41474f;border-color:#41474f;color:#fff;font-weight:500}
.radar .area.cmp{fill:var(--pb);fill-opacity:.13;stroke:var(--pb);stroke-width:1.6}
.rleg{display:flex;gap:16px;justify-content:center;font-size:11px;color:var(--ink-2);margin:0}
.rleg .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;
  background:var(--rc);vertical-align:-1px}
.rleg .sw.cmp{background:var(--pb)}
.dtable.cmp{margin-top:6px}
.dtable.cmp th{font-size:10.5px}
.dtable.cmp td{padding:3px 6px}
.rraw2{display:block;font-size:9.5px;color:var(--ink-3);font-weight:400}
.dtable.cmp td.up{color:#12705a;font-weight:600}
.dtable.cmp td.down{color:#9c3f3f;font-weight:600}
.dtable.cmp td.nil{color:var(--ink-3)}
.rnote{color:var(--ink-3);font-size:11px;line-height:1.45;margin-top:4px}
.mdnote{grid-column:1/-1;font-size:9.5px;color:var(--rule-2);font-style:italic;
  margin-top:3px;cursor:help}

#tip{position:fixed;z-index:60;max-width:312px;background:#1b1f26;color:#eef1f5;padding:8px 10px;
  border-radius:4px;font-size:12px;line-height:1.5;pointer-events:none;opacity:0;
  transition:opacity .09s;box-shadow:0 3px 14px rgba(0,0,0,.22)}
#tip.on{opacity:1}
#tip b{display:block;margin-bottom:3px}
#tip .src{display:block;margin-top:7px;padding-top:6px;border-top:1px solid #333a44;
  color:#98a3b4;font-size:11px;line-height:1.5}
#tip .pvk{color:#6f7d8f;font-size:10px;letter-spacing:.03em;margin-right:4px}
#tip code{font-family:var(--num);font-size:10px;color:#b9c4d2}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--g-def);outline-offset:1px}
</style>
</head>
<body>

<div class="masthead">
  <h1>Player table</h1><span class="sub" id="scope"></span>
  <span class="spacer"></span>
  <button class="jump plain dense" id="denseBtn" title="Compact rows">Compact</button>
  <button class="freshness" id="freshness" title="Reload"></button>
  <div class="bellwrap">
    <button class="bell" id="bellBtn" aria-label="Data status"><span class="bico">◎</span>
      <span class="bdot" id="bellDot" hidden></span></button>
    <div class="bellpanel" id="bellPanel"></div>
  </div>
</div>
<div class="banner" id="banner" hidden></div>

<div class="controls">
  <div class="filters">
    <div class="field"><label>View</label><div id="fViews"></div></div>
    <div class="field"><label>Search</label>
      <input type="text" id="fQ" class="txtin" placeholder="Player name"></div>
    <div class="field"><label>Seasons</label><div id="fSeason"></div></div>
    <div class="field"><label>Position</label><div class="posrow" id="fPos"></div></div>
    <div class="field"><label>Club</label><div id="fClub"></div></div>
    <div class="field"><label>Nationality</label><div id="fNat"></div></div>
    <div class="field"><label>Age</label>
      <div class="range2"><input type="number" id="fAgeMin" min="15" max="45" placeholder="any">
      <span>to</span><input type="number" id="fAgeMax" min="15" max="45" placeholder="any"></div></div>
    <div class="field"><label>Minimum minutes</label>
      <div class="minutes"><input type="range" id="fMin" min="0" max="3420" step="90" value="600">
      <span class="val" id="fMinVal">600</span></div></div>
    <div class="field"><label>Min minutes / app</label>
      <div class="minutes"><input type="range" id="fMpa" min="0" max="90" step="5" value="0">
      <span class="val" id="fMpaVal">0</span></div></div>
    <button class="clear" id="clearBtn">Clear filters</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="frames">
    <span class="lbl">Frame</span>
    <span class="seg" id="frameSeg"></span>
    <button class="chip toggle rankbtn" id="rankChip">Rank</button>
    <span class="lbl" style="margin-left:10px">Metrics</span>
    <span class="chips" id="metricChips"></span>
    <span class="pickwrap" id="presets"></span>
  </div>
</div>

<div class="jumpbar" id="jumpbar"></div>
<div class="keystrip" id="keystrip"></div>
<div class="tablewrap" id="tablewrap">
  <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
  <div class="empty" id="empty" hidden></div>
</div>

<div class="foot">
  <span id="count"></span>
  <span class="hint">click a row for the full profile</span>
  <span class="spacer"></span>
  <div class="pager"><button id="prev">&lsaquo;</button><span class="pos" id="pagepos"></span><button id="next">&rsaquo;</button></div>
</div>

<div id="backdrop"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dhead" id="dHead"></div>
  <div class="dbody" id="dBody"></div>
</aside>
<div id="tip"></div>

<script type="module">
const DATA='./data/';
const PAGE=50;
/* Rates from tiny samples are noise. Set to 0 to always show them. */
const FLOOR=0;

let METRICS=[
 {key:'goals',label:'Goals',group:'Attacking',src:'match',pos:['DEF','MID','FWD'],fmt:'2dp',k:12,dir:1,share:true,
  desc:'Goals scored, penalties included.'},
 {key:'assists',label:'Assists',group:'Attacking',src:'match',pos:['DEF','MID','FWD'],fmt:'2dp',k:14,dir:1,share:true,
  desc:'The final pass before a goal. FPL\u2019s definition is looser than Opta\u2019s — it also credits winning a penalty.'},
 {key:'xg',label:'xG',group:'Attacking',src:'match',pos:['DEF','MID','FWD'],fmt:'2dp',k:8,dir:1,share:true,
  desc:'Expected goals. The scoring probability of every shot taken, added up. Measures the quality and volume of chances a player gets, independent of whether they went in — which is why it predicts future scoring better than goals do.'},
 {key:'xa',label:'xA',group:'Attacking',src:'match',pos:['DEF','MID','FWD'],fmt:'2dp',k:10,dir:1,share:true,
  desc:'Expected assists. The scoring probability of the shots a player set up. Credits creating a good chance even when the shooter misses.'},
 {key:'xgi',label:'xGI',group:'Attacking',src:'match',pos:['DEF','MID','FWD'],fmt:'2dp',k:8,dir:1,share:true,
  desc:'Expected goal involvement — xG plus xA. The broadest single measure of attacking contribution.'},
 {key:'tackles',label:'Tackles',group:'Defensive',src:'match',pos:['DEF','MID','FWD'],fmt:'2dp',k:5,dir:1,share:true,
  desc:'Successful tackles. High for players who defend in open space, low for those whose team rarely loses the ball.'},
 {key:'recoveries',label:'Recoveries',group:'Defensive',src:'match',pos:['DEF','MID','FWD'],fmt:'2dp',k:4,dir:1,share:true,
  desc:'Loose balls won back. The highest-volume defensive stat here, so it settles down fastest on a small sample.'},
 {key:'cbi',label:'CBI',group:'Defensive',src:'match',pos:['DEF','MID','FWD'],fmt:'2dp',k:5,dir:1,share:true,
  desc:'Clearances, blocks and interceptions combined. Inflated for defenders in teams that spend long spells under pressure — read it next to the team share.'},
 {key:'defcon',label:'Def. contribution',group:'Defensive',src:'match',pos:['DEF','MID','FWD'],fmt:'2dp',k:4,dir:1,share:true,
  desc:'FPL\u2019s composite of tackles, interceptions, clearances, blocks and recoveries, used to award defensive points. Built from the other columns in this group, so it moves with them rather than adding anything new.'},
 {key:'saves',label:'Saves',group:'Goalkeeping',src:'match',pos:['GK'],fmt:'2dp',k:5,dir:1,
  desc:'Shots saved. Counter-intuitively high for keepers in poor teams, who simply face more shots.'},
 {key:'gc',label:'Conceded',group:'Goalkeeping',src:'match',pos:['GK'],fmt:'2dp',k:6,dir:-1,
  desc:'Goals conceded. Lower is better, so ranking treats a small number as a good one.'},
 {key:'xgc',label:'xGC',group:'Goalkeeping',src:'match',pos:['GK','DEF','MID','FWD'],fmt:'2dp',k:5,dir:-1,
  desc:'Expected goals conceded by the team while this player was on the pitch. A read on the defence around them rather than on the player. Lower is better.'},
 {key:'cs',label:'Clean sheets',group:'Goalkeeping',src:'match',pos:['GK','DEF'],fmt:'2dp',k:8,dir:1,
  desc:'Matches where the team conceded nothing while this player was on. Almost entirely a team-quality signal.'},
 {key:'pensaved',label:'Pens saved',group:'Goalkeeping',src:'match',pos:['GK'],fmt:'2dp',k:20,dir:1,
  desc:'Penalties saved. Far too rare to say anything about skill over one season — shown for completeness and shrunk hard toward the average.'},
 {key:'yellow',label:'Yellow cards',group:'Discipline',src:'match',pos:['GK','DEF','MID','FWD'],fmt:'2dp',k:8,dir:-1,
  desc:'Yellow cards. Costs 1 FPL point each. Lower is better, so ranking treats a small number as good.'},
 {key:'red',label:'Red cards',group:'Discipline',src:'match',pos:['GK','DEF','MID','FWD'],fmt:'2dp',k:20,dir:-1,
  desc:'Red cards. Costs 3 FPL points, and the player also forfeits any points from that match onward. Rare enough that one card dominates a season rate — shrunk hard.'},
 {key:'og',label:'Own goals',group:'Discipline',src:'match',pos:['GK','DEF','MID','FWD'],fmt:'2dp',k:20,dir:-1,
  desc:'Own goals. Costs 2 FPL points. Essentially random at the individual level.'},
 {key:'penmissed',label:'Pens missed',group:'Discipline',src:'match',pos:['DEF','MID','FWD'],fmt:'2dp',k:20,dir:-1,
  desc:'Penalties missed. Costs 2 FPL points. Read alongside the penalty-taking order rather than as a skill signal — only the designated taker can miss one.'},
 {key:'points',label:'Points',group:'Fantasy',src:'fpl',pos:['GK','DEF','MID','FWD'],fmt:'2dp',k:6,dir:1,
  desc:'FPL points. A scoring convention rather than a football measurement, weighted toward goals, clean sheets and simply turning up.'},
 {key:'netpoints',label:'Points (net)',group:'Fantasy',src:'fpl',pos:['GK','DEF','MID','FWD'],fmt:'2dp',k:8,dir:1,
  desc:'FPL points with appearance points removed — 2 per start of 60 minutes or more, 1 per shorter outing. Raw points per 90 is badly distorted for substitutes, who bank a point for a few minutes on the pitch: a player making twenty nine-minute cameos can top the points-per-90 table on appearance points alone. This strips that out.'},
 {key:'bps',label:'BPS',group:'Fantasy',src:'fpl',pos:['GK','DEF','MID','FWD'],fmt:'1dp',k:5,dir:1,
  desc:'Bonus Points System — FPL\u2019s internal per-match score across roughly thirty actions, used to decide who gets bonus points. Not a public football statistic.'},
 {key:'bonus',label:'Bonus',group:'Fantasy',src:'fpl',pos:['GK','DEF','MID','FWD'],fmt:'2dp',k:10,dir:1,
  desc:'Bonus points awarded: three, two or one to the highest BPS scorers in each match.'},
 {key:'influence',label:'Influence',group:'Fantasy',src:'fpl',pos:['GK','DEF','MID','FWD'],fmt:'1dp',k:5,dir:1,
  desc:'FPL index estimating impact on match outcomes. The weighting is proprietary and unpublished, so treat it as an FPL tool rather than a scouting measure.'},
 {key:'creativity',label:'Creativity',group:'Fantasy',src:'fpl',pos:['GK','DEF','MID','FWD'],fmt:'1dp',k:6,dir:1,
  desc:'FPL index for chance creation. Tracks xA closely but is calculated differently and never published in full.'},
 {key:'threat',label:'Threat',group:'Fantasy',src:'fpl',pos:['GK','DEF','MID','FWD'],fmt:'1dp',k:6,dir:1,
  desc:'FPL index for goal threat, weighted by shot location and volume. Tracks xG closely.'},
 {key:'ict',label:'ICT',group:'Fantasy',src:'fpl',pos:['GK','DEF','MID','FWD'],fmt:'1dp',k:5,dir:1,
  desc:'Influence, Creativity and Threat rolled into one index. Contains nothing the three separate columns do not.'},
];
const M=k=>METRICS.find(m=>m.key===k);
const GROUPS=['Attacking','Defensive','Goalkeeping','Discipline','Fantasy',
  'Passing','Territory','Duels'];
const KC={Attacking:'k-att',Defensive:'k-def',Goalkeeping:'k-gk',Discipline:'k-dis',Fantasy:'k-fpl',Passing:'k-pas'};
const CC={Attacking:'c-att',Defensive:'c-def',Goalkeeping:'c-gk',Discipline:'c-dis',Fantasy:'c-fpl',Passing:'c-pas'};
const SC={Attacking:'s-att',Defensive:'s-def',Goalkeeping:'s-gk',Discipline:'s-dis',Fantasy:'s-fpl',Passing:'s-pas'};
const TC={Attacking:'t-att',Defensive:'t-def',Goalkeeping:'t-gk',Discipline:'t-dis',
  Fantasy:'t-fpl',Passing:'t-pas',All:'t-all'};
/* The Fantasy tab is a view, not a group: everything that moves the points
   total, wherever it lives, followed by FPL's own indices. */
const FANTASY_SET=['points','netpoints','bonus','bps','goals','assists','cs','defcon',
  'saves','pensaved','penmissed','yellow','red','og','influence','creativity','threat','ict'];
const SRC={match:'Match data, from the Premier League\u2019s official feed.',
  fpl:'Fantasy Premier League scoring layer — a game convention, not a football measurement.'};
const FEEDNAME={fpl:'Fantasy Premier League API',opta:'Premier League (Opta)',
  vaastav:'vaastav archive',fplcache:'fplcache snapshots',derived:'computed here'};
/* Everything the register knows about a metric, for the hover. */
function provenance(m){
  if(!m)return '';
  const bits=[];
  if(m.definition&&m.definition!==m.desc)bits.push(m.definition);
  if(m.derived_from)bits.push(`<span class="pvk">Calculated as</span> ${m.derived_from}`);
  if(m.caveat)bits.push(`<span class="pvk">Watch out</span> ${m.caveat}`);
  if(m.coverage_note)bits.push(`<span class="pvk">Coverage</span> ${m.coverage_note}`);
  else if(m.first_season)bits.push(`<span class="pvk">Coverage</span> from ${m.first_season}`+
    (m.last_season?` to ${m.last_season}`:''));
  const feed=FEEDNAME[m.feed]||(m.src==='fpl'?FEEDNAME.fpl:FEEDNAME.opta);
  bits.push(`<span class="pvk">Source</span> ${feed}`+
    (m.raw_field?` · <code>${m.raw_field}</code>`:''));
  return bits.length?`<span class="src">${bits.join('<br>')}</span>`:'';
}

const FRAME_DEFS=[
 {id:'total',label:'Total',block:'obs',
  tip:['total','The raw count across the selected range. No adjustment of any kind.']},
 {id:'p90',label:'/90',block:'der',
  tip:['per 90 minutes','Total divided by 90-minute periods played. Honest for regular starters, unstable for short samples — one goal in 120 minutes reads as 0.75 per 90.']},
 {id:'app',label:'/app',block:'der',
  tip:['per appearance','Total divided by matches involved in, however few minutes each. Reads the opposite way to per 90: it flatters starters and punishes substitutes. A wide gap between the two means a cameo role.']},
 {id:'adj90',label:'Adj',block:'der',
  tip:['adjusted per 90','The per-90 rate pulled toward the positional average by an amount set by how little of the player we have seen. A full season barely moves; a few hundred minutes moves a long way. The best estimate of a true rate, and what ranking uses.']},
 {id:'share',label:'Share',block:'der',
  tip:['share of team','This player\u2019s output as a proportion of their club\u2019s total over the matches they were at the club. Strips out team quality — someone carrying a quarter of a weak side\u2019s chances stands out here in a way raw totals hide. Note this frame is NOT shrunk for sample size, unlike Adj.']},
];
const FR=id=>FRAME_DEFS.find(f=>f.id===id);

const BASE_TIPS={
 web_name:['Player','Name as FPL lists it. Anyone who changed club inside the range is marked “moved” and aggregated under their most recent club. Click any row for the full profile.'],
 team_name:['Club','Most recent club within the selected season range.'],
 position:['Position','FPL\u2019s position, which sets both the scoring rules and the comparison pool. Not always where the player actually plays.'],
 age:['Age','Age today, from FPL\u2019s recorded date of birth.'],
 minutes:['Minutes','Total minutes across the range. The most important column here — every rate beside it is only as trustworthy as this number is large.'],
 appearances:['Appearances','Matches with any minutes at all, including late substitutions.'],
 starts:['Starts','Matches started.'],
 apps_60:['60+ minutes','Appearances of at least an hour. The gap between this and Appearances separates a nailed starter from someone regularly hooked.'],
 min_per_app:['Minutes per appearance','Average minutes when involved. A low number means a cameo role however big the total looks.'],
 minutes_share:['Minutes share','Share of the minutes available at their club while they were there. Survives international breaks and unequal fixture counts in a way raw minutes does not.'],
};
const RANK_TIP=['rank','Position among the players currently passing your filters, on the adjusted rate. The denominator is that filtered pool, so it moves as you filter.'];
const ALLPOS=['GK','DEF','MID','FWD'];

/* Club colours — first and second kit colours, split top/bottom in the bar.
   Not badges: colours are not protected, so nothing here is trademarked.
   Unknown clubs fall back to grey. */
const CLUBS={
 'Arsenal':['#EF0107','#FFFFFF'],       'Aston Villa':['#670E36','#95BFE5'],
 'Bournemouth':['#DA291C','#000000'],   'Brentford':['#E30613','#FFFFFF'],
 'Brighton':['#0057B8','#FFFFFF'],      'Burnley':['#6C1D45','#99D6EA'],
 'Chelsea':['#034694','#1F5FA9'],       'Crystal Palace':['#1B458F','#C4122E'],
 'Everton':['#003399','#FFFFFF'],       'Fulham':['#FFFFFF','#000000'],
 'Ipswich':['#3A64A3','#FFFFFF'],       'Leeds':['#FFFFFF','#1D428A'],
 'Leicester':['#003090','#FDBE11'],     'Liverpool':['#C8102E','#00B2A9'],
 'Luton':['#F78F1E','#002D62'],         'Man City':['#6CABDD','#1C2C5B'],
 'Man Utd':['#DA291C','#000000'],       'Newcastle':['#241F20','#FFFFFF'],
 "Nott'm Forest":['#DD0000','#FFFFFF'], 'Norwich':['#FFF200','#00A650'],
 'Sheffield Utd':['#EE2737','#FFFFFF'], 'Southampton':['#D71920','#FFFFFF'],
 'Spurs':['#FFFFFF','#132257'],         'Sunderland':['#EB172B','#FFFFFF'],
 'Watford':['#FBEE23','#ED2127'],       'West Brom':['#122F67','#FFFFFF'],
 'West Ham':['#7A263A','#1BB1E7'],      'Wolves':['#FDB913','#231F20'],
};
const clubBar=(name,lg)=>{
  const c=CLUBS[name]||['#c9ced6','#9aa3b0'];
  return `<span class="cbar${lg?' lg':''}" style="--c1:${c[0]};--c2:${c[1]}"></span>`;
};

const state={seasons:[],pos:[],club:[],nat:[],minMinutes:600,mpaMin:0,
  q:'',extra:[],pickFam:'All',dense:false,showKey:false,ageMin:null,ageMax:null,pins:[],cmp:null,cmpFrame:'adj90',profTab:'Overview',simSamePos:true,logOpen:null,logSeasons:[],radars:[],radarMode:'perf',
  tab:'Attacking',frames:['total','adj90'],off:[],rank:false,
  sort:'minutes',page:0,sel:null};

/* accent-insensitive compare, so "petrovic" finds "Petrović" */
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

function readHash(){
  if(!location.hash)return;
  const p=new URLSearchParams(location.hash.slice(1));
  const L=k=>p.get(k)?p.get(k).split(',').filter(Boolean):[];
  state.seasons=L('sn');
  state.pos=L('pos');state.club=L('club');state.nat=L('nat');
  if(p.get('min'))state.minMinutes=+p.get('min');
  if(p.get('mpa'))state.mpaMin=+p.get('mpa');
  if(p.get('q'))state.q=p.get('q');
  if(p.get('a0'))state.ageMin=+p.get('a0');
  if(p.get('a1'))state.ageMax=+p.get('a1');

  if(p.get('cmp'))state.cmp=+p.get('cmp');

  if(p.get('cfr'))state.cmpFrame=p.get('cfr');

  state.dense=p.get('dense')==='1';

  if(p.get('sp'))state.simSamePos=p.get('sp')==='1';
  if(p.get('tab'))state.tab=p.get('tab');
  if(p.has('fr'))state.frames=L('fr');
  state.off=L('off');
  state.extra=L('ex');
  if(p.get('pf'))state.pickFam=p.get('pf');

}
function hashString(){
  const p=new URLSearchParams();
  p.set('sn',state.seasons.join(','));
  if(state.pos.length)p.set('pos',state.pos.join(','));
  if(state.club.length)p.set('club',state.club.join(','));
  if(state.nat.length)p.set('nat',state.nat.join(','));
  p.set('min',state.minMinutes);
  if(state.mpaMin)p.set('mpa',state.mpaMin);
  if(state.q)p.set('q',state.q);
  if(state.ageMin!=null)p.set('a0',state.ageMin);
  if(state.ageMax!=null)p.set('a1',state.ageMax);
  if(state.pins.length)p.set('pin',state.pins.join(','));
  if(state.cmp)p.set('cmp',state.cmp);
  if(state.radars.length)p.set('rad',state.radars.join(','));
  if(state.radarMode!=='perf')p.set('rmode',state.radarMode);
  if(state.cmpFrame!=='adj90')p.set('cfr',state.cmpFrame);
  if(state.profTab!=='Overview')p.set('pt',state.profTab);
  if(state.dense)p.set('dense','1');
  if(state.showKey)p.set('key','1');
  if(!state.simSamePos)p.set('sp','0');
  p.set('tab',state.tab);p.set('fr',state.frames.join(','));
  if(state.off.length)p.set('off',state.off.join(','));
  if((state.extra||[]).length)p.set('ex',state.extra.join(','));
  if(state.pickFam!=='All')p.set('pf',state.pickFam);
  if(state.rank)p.set('rank','1');
  p.set('sort',state.sort);
  if(state.page)p.set('page',state.page);
  return p.toString();
}

const VIEWS_KEY='fpl:views';

/* Push state back into the controls that hold their own DOM value. */
function syncControls(){

async function applyView(hash){

     (state.extra||[]).some(k=>k.startsWith('o_')))await ensureOpta();
  buildFilters();syncControls();buildTabs();buildFrames();render();
  buildViews();

function buildViews(){
  const host=document.getElementById('fViews');
  if(!host)return;
  const views=loadViews();
  host.className='ms';
  host.innerHTML=
    `<button class="ms-btn" id="viewBtn"><span>`+
    (views.length?`${views.length} saved`:'Views')+
    `</span><span class="car">▾</span></button>`+
    `<div class="ms-panel viewpanel">`+
    (views.length?`<div class="ms-list">`+views.map((v,i)=>
      `<div class="vrow"><button class="vname" data-view="${i}" `+
      `title="Load this view">${v.name}</button>`+
      `<button class="vdel" data-vdel="${i}" title="Delete">×</button></div>`).join('')+
      `</div>`
      :`<div class="ms-none">No saved views yet. Set up the filters and metrics `+
       `you want, then save them here.</div>`)+
    `<div class="vsave"><input type="text" id="vName" placeholder="name this view…">`+
    `<button id="vAdd">Save</button></div></div>`;

  const btn=document.getElementById('viewBtn'),panel=host.querySelector('.ms-panel');
  btn.onclick=e=>{
    e.stopPropagation();
    const open=panel.classList.contains('on');
    document.querySelectorAll('.ms-panel.on,.bellpanel.on').forEach(x=>x.classList.remove('on'));
    if(!open){panel.classList.add('on');document.getElementById('vName').focus();}};
  panel.onclick=e=>e.stopPropagation();

  host.querySelectorAll('[data-view]').forEach(b=>{
    b.onclick=()=>{panel.classList.remove('on');applyView(views[+b.dataset.view].hash);};});
  host.querySelectorAll('[data-vdel]').forEach(b=>{
    b.onclick=()=>{const v=loadViews();v.splice(+b.dataset.vdel,1);saveViews(v);
      buildViews();document.querySelector('#fViews .ms-panel').classList.add('on');};});

  const add=()=>{
    const el=document.getElementById('vName');
    const name=(el.value||'').trim();
    if(!name)return;
    const v=loadViews();
    const at=v.findIndex(x=>x.name===name);
    const entry={name,hash:hashString(),saved:new Date().toISOString()};
    if(at>=0)v[at]=entry;else v.push(entry);
    saveViews(v);buildViews();
    document.querySelector('#fViews .ms-panel').classList.add('on');};
  document.getElementById('vAdd').onclick=add;
  document.getElementById('vName').onkeydown=e=>{if(e.key==='Enter')add();};
}

const store={manifest:null,seasons:{},logs:{},style:{},clusters:null,status:null,demo:false};
async function getJSON(f){
  const r=await fetch(DATA+f,{cache:'no-store'});
  if(!r.ok)throw new Error(f+' '+r.status);
  return r.json();
}
/* Match logs are large, so they load only when a drawer is first opened. */
async function loadLogs(season){
  if(store.logs[season]!==undefined)return store.logs[season];
  store.logs[season]=null;
  try{store.logs[season]=await getJSON(`matchlogs_${season}.json`);}
  catch(e){store.logs[season]=null;}
  return store.logs[season];
}
async function load(){
  try{
    store.manifest=await getJSON('manifest.json');
    try{METRICS=normalise(await getJSON('metrics.json'));}catch(e){}
    try{mergeRegister(await getJSON('metrics_register.json'));}catch(e){}
    for(const s of store.manifest.seasons)
      store.seasons[s.season]=await getJSON(`players_${s.season}.json`);
    try{store.status=await getJSON('status.json');}catch(e){}
    try{store.clusters=await getJSON('clusters.json');}catch(e){}
    if(store.clusters)for(const s of store.manifest.seasons){
      try{store.style[s.season]=await getJSON(`style_${s.season}.json`);}catch(e){}
    }
  }catch(err){
    store.demo=true;
    store.manifest={seasons:[{season:'2025-26'}],generated_at:new Date().toISOString()};
    store.seasons['2025-26']=demoRows();
  }
  for(const s in store.seasons)for(const r of store.seasons[s]){
    if(r.points_total==null||r.appearances==null){r.netpoints_total=null;continue;}
    const long=r.apps_60??0,short=Math.max(0,r.appearances-long);
    r.netpoints_total=+(r.points_total-(2*long+short)).toFixed(2);
  }
}
function normalise(raw){
  return raw.map(m=>({key:m.name,label:m.display_name,group:m.group,src:m.src||'match',
    pos:(m.applies_to_positions||'GK,DEF,MID,FWD').split(',').map(s=>s.trim()),
    fmt:m.format||'2dp',k:m.k??10,dir:m.direction??1,share:!!m.share,
    desc:m.description||M(m.name)?.desc||''}));
}

function demoRows(){
  let seed=20252026;
  const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
  const nrm=()=>(rnd()+rnd()+rnd()-1.5)/1.5;
  const clubs=['Arsenal','Aston Villa','Bournemouth','Brentford','Brighton','Burnley','Chelsea','Crystal Palace','Everton','Fulham','Leeds','Liverpool','Man City','Man Utd',"Nott'm Forest",'Newcastle','Spurs','Sunderland','West Ham','Wolves'];
  const nats=['England','England','England','France','Brazil','Spain','Portugal','Netherlands','Argentina','Belgium','Germany','Norway','Denmark','Japan','Sweden','Ireland','Scotland','Italy','Uruguay','Ghana'];
  const fn=['Leo','Marcus','Tomas','Noah','Ilya','Andre','Kai','Bruno','Elias','Jude','Femi','Sacha','Dani','Otto','Ruben','Nico','Ravi','Mateo','Finn','Kasper'];
  const ln=['Halden','Rivas','Okonkwo','Berg','Marchetti','Duval','Sandoval','Lindqvist','Ferreira','Nakamura','Osei','Kovac','Brennan','Vogel','Almeida','Petrov','Iqbal','Solano','Novak','Whitlock'];
  const rows=[];let id=1;
  for(let c=0;c<clubs.length;c++){
    const str=.55+rnd()*.9;
    for(const [pos,n] of [['GK',3],['DEF',7],['MID',8],['FWD',4]]){
      for(let i=0;i<n;i++){
        const starter=i<(pos==='GK'?1:pos==='DEF'?4:pos==='MID'?4:2);
        const mins=Math.round((starter?2100+rnd()*1300:180+rnd()*1400)/10)*10;
        if(mins<90)continue;
        const n90=mins/90;
        const att=pos==='FWD'?1:pos==='MID'?.55:pos==='DEF'?.12:0;
        const def=pos==='DEF'?1:pos==='MID'?.62:pos==='FWD'?.2:0;
        const r={player_code:id++,web_name:`${fn[Math.floor(rnd()*fn.length)]} ${ln[Math.floor(rnd()*ln.length)]}`,
          team_name:clubs[c],position:pos,nationality:nats[Math.floor(rnd()*nats.length)],
          birth_date:`${1991+Math.floor(rnd()*15)}-0${1+Math.floor(rnd()*9)}-1${Math.floor(rnd()*9)}`,
          minutes:mins,appearances:Math.round(n90*(.9+rnd()*.35)),starts:Math.round(n90*(.75+rnd()*.3)),
          apps_60:Math.round(n90*(.7+rnd()*.3)),team_minutes:3420,moved:rnd()<.045};
        const rate=(b,s)=>Math.max(0,b*(1+nrm()*s));
        const put=(k,p)=>{r[k+'_total']=+(p*n90).toFixed(2);};
        put('xg',rate(.30*att*str,.7));put('xa',rate(.18*(att*.7+.3)*str,.7));
        r.xgi_total=+(r.xg_total+r.xa_total).toFixed(2);
        put('goals',rate(.26*att*str,.9));put('assists',rate(.16*(att*.7+.3)*str,.9));
        put('threat',rate(38*att*str,.6));put('creativity',rate(30*(att*.6+.4)*str,.6));
        put('tackles',rate(1.5*def+.3,.5));put('recoveries',rate(5.2*def+1.4,.4));
        put('cbi',rate(4.4*def+.4,.6));put('defcon',rate(7*def+1.2,.4));
        if(pos==='GK'){put('saves',rate(3.1/str,.3));put('gc',rate(1.45/str,.35));
          put('xgc',rate(1.4/str,.3));put('cs',rate(.3*str,.6));put('pensaved',rate(.03,1.4));}
        else{put('xgc',rate(1.4/str,.3));if(pos==='DEF')put('cs',rate(.3*str,.6));}
        put('points',rate((pos==='FWD'?4.2:pos==='MID'?3.9:pos==='DEF'?3.6:3.4)*str,.35));
        put('bps',rate(19*str,.3));put('bonus',rate(.22*str,.9));
        put('influence',rate(21*str,.35));put('ict',rate(7.5*str,.4));
        rows.push(r);
      }
    }
  }
  const byTeam={};
  for(const r of rows)(byTeam[r.team_name]||=[]).push(r);
  for(const t in byTeam)for(const m of METRICS.filter(m=>m.share)){
    const sum=byTeam[t].reduce((a,r)=>a+(r[m.key+'_total']||0),0);
    for(const r of byTeam[t])if(sum>0&&r[m.key+'_total']!=null)r[m.key+'_team']=sum;
  }
  return rows;
}

const allSeasons=()=>store.manifest.seasons.map(s=>s.season).sort();
/* chronological — aggregation relies on the newest season landing last,
   so "most recent club" resolves correctly */
function seasonsInRange(){
  const all=allSeasons(),sel=state.seasons.filter(s=>all.includes(s));
  return sel.length?all.filter(s=>sel.includes(s)):[all[all.length-1]];
}
let cacheKey='',cacheRows=null;
function aggregate(){
  const key=seasonsInRange().join('|');
  if(key===cacheKey&&cacheRows)return cacheRows;
  const by=new Map();
  for(const s of seasonsInRange())for(const r of (store.seasons[s]||[])){
    let a=by.get(r.player_code);
    if(!a){a={player_code:r.player_code,web_name:r.web_name,
      first_name:r.first_name,second_name:r.second_name,position:r.position,
      nationality:r.nationality,birth_date:r.birth_date,team_name:r.team_name,minutes:0,
      appearances:0,starts:0,apps_60:0,team_minutes:0,seasons:0,moved:false,_s:{},_n:{},_d:{}};
      by.set(r.player_code,a);}
    a.moved=a.moved||!!r.moved||(a.seasons>0&&a.team_name!==r.team_name);
    a.team_name=r.team_name;
    a.minutes+=r.minutes||0;a.appearances+=r.appearances||0;a.starts+=r.starts||0;
    a.apps_60+=r.apps_60||0;a.team_minutes+=r.team_minutes||0;a.seasons++;
    for(const m of METRICS){
      const v=r[m.key+'_total'];
      if(v!=null)a._s[m.key]=(a._s[m.key]||0)+v;
      const tm=r[m.key+'_team'],sh=r[m.key+'_share'];
      if(m.share&&v!=null){
        if(tm!=null&&tm>0){a._n[m.key]=(a._n[m.key]||0)+v;a._d[m.key]=(a._d[m.key]||0)+tm;}
        else if(sh!=null&&sh>0){a._n[m.key]=(a._n[m.key]||0)+v;a._d[m.key]=(a._d[m.key]||0)+v/sh;}
      }
    }
  }
  const rows=[...by.values()],pool={};
  for(const p of ALLPOS){
    const set=rows.filter(r=>r.position===p&&r.minutes>=180);pool[p]={};
    for(const m of METRICS){let t=0,mn=0;
      for(const r of set)if(r._s[m.key]!=null){t+=r._s[m.key];mn+=r.minutes;}
      pool[p][m.key]=mn>0?t/(mn/90):null;}
  }
  for(const r of rows){
    const n90=r.minutes/90;
    r.age=r.birth_date?Math.floor((Date.now()-new Date(r.birth_date))/3.15576e10):null;
    r.min_per_app=r.appearances?r.minutes/r.appearances:null;
    r.minutes_share=r.team_minutes?r.minutes/r.team_minutes:null;
    for(const m of METRICS){
      const t=r._s[m.key],mean=pool[r.position]?.[m.key];
      r[m.key+'_total']=t??null;
      r[m.key+'_p90']=t!=null&&n90>0?t/n90:null;
      r[m.key+'_app']=t!=null&&r.appearances>0?t/r.appearances:null;
      r[m.key+'_adj90']=(t!=null&&mean!=null)?(t+m.k*mean)/(n90+m.k):null;
      r[m.key+'_share']=(m.share&&r._d[m.key])?r._n[m.key]/r._d[m.key]:null;
    }
  }
  cacheKey=key;cacheRows=rows;return rows;
}

let REG_INDEX=new Map(),REG_N=0;
function metricOrder(m,group){
  const list=PRIORITY[group||m.group]||[];
  let i=list.indexOf(m.key);
  if(i<0)i=list.indexOf(norm(m.label));
  if(i>=0)return i;
  if(REG_N!==METRICS.length){        /* rebuild when the register adds metrics */
    REG_INDEX=new Map();METRICS.forEach((x,n)=>REG_INDEX.set(x.key,n));
    REG_N=METRICS.length;
  }
  return 1000+(REG_INDEX.get(m.key)??999);
}
const byPriority=(group)=>(a,b)=>metricOrder(a,group)-metricOrder(b,group);

/* Two metrics with the same label in one group are the same concept measured
   by two feeds. Keep the FPL one — it is core, it is what the fantasy views
   use, and one Goals column beats two that disagree. */
function dedupeConcepts(list){
  const seen=new Map();
  for(const m of list){
    const c=norm(m.label);
    const prev=seen.get(c);
    if(!prev){seen.set(c,m);continue;}
    const prevFpl=prev.feed==='fpl'||prev.src==='fpl'||!prev.key.startsWith('o_');
    const curFpl=m.feed==='fpl'||m.src==='fpl'||!m.key.startsWith('o_');
    if(curFpl&&!prevFpl)seen.set(c,m);
  }
  return [...seen.values()];
}
function groupMetrics(g){
  const list=g==='All'?METRICS.slice()
    :g==='Fantasy'?FANTASY_SET.map(M).filter(Boolean)
    :METRICS.filter(m=>m.group===g);
  return g==='Fantasy'?list:dedupeConcepts(list).sort(byPriority(g));
}
function tabMetrics(){
  const pos=state.pos.length?state.pos:ALLPOS;
  return groupMetrics(state.tab).filter(m=>pos.some(p=>m.pos.includes(p)));
}
const activeStats=()=>{
  const extra=(state.extra||[]).map(M).filter(Boolean);
  const base=tabMetrics().filter(m=>!state.off.includes(m.key));
  const seen=new Set(base.map(m=>m.key));
  return base.concat(extra.filter(m=>!seen.has(m.key))).map(m=>m.key);
};

const abbrCache=new Map();
function abbr(m){
  if(abbrCache.has(m.key))return abbrCache.get(m.key);
  let out=ABBR_EXACT[m.key];
  if(!out){
    let k=m.key.replace(/^o_/,'');
    const parts=[];
    let guard=0;
    while(k.length&&guard++<12){
      const hit=ABBR_TOKENS.find(([t])=>k.startsWith(t+'_')||k===t);
      if(hit){parts.push(hit[1]);k=k.slice(hit[0].length).replace(/^_/,'');continue;}
      const seg=k.split('_')[0];
      parts.push(seg.charAt(0).toUpperCase()+seg.slice(1));
      k=k.slice(seg.length).replace(/^_/,'');
    }
    out=parts.filter(Boolean).join(' ');
    if(out.length>16)out=out.slice(0,15)+'…';
  }
  abbrCache.set(m.key,out);
  return out;
}
const FRAME_SUFFIX={total:'',p90:'/90',app:'/app',adj90:' adj',share:' sh'};

function columns(){
  const stats=activeStats(),frames=activeFrames();
  const cols=[
   {id:'web_name',label:'Player',block:'id',type:'name',frz:0},
   {id:'team_name',label:'Club',block:'id',type:'txt',cls:'club',frz:1},
   {id:'position',label:'Pos',block:'id',type:'txt',frz:2},
   {id:'age',label:'Age',block:'id',fmt:'int',frz:3},
   {id:'minutes',label:'Min',block:'id',fmt:'int',frz:4,frzlast:true},
   {id:'appearances',label:'Apps',block:'obs',fmt:'int',famgap:true},
   {id:'starts',label:'Starts',block:'obs',fmt:'int'},
   {id:'apps_60',label:'60+',block:'obs',fmt:'int'},
   {id:'min_per_app',label:'Min/app',block:'obs',fmt:'int'},
   {id:'minutes_share',label:'Min %',block:'der',fmt:'pct'}];
  const famSeen=new Set();
  const sorted=stats.slice().sort((a,b)=>{
    const ma=M(a),mb=M(b);
    const fa=ma.src==='fpl',fb=mb.src==='fpl';
    if(fa!==fb)return fa?1:-1;
    return metricOrder(ma,state.tab)-metricOrder(mb,state.tab);});
  for(const k of sorted){
    const m=M(k),isFpl=m.src==='fpl';
    let first=true;
    for(const f of frames){
      if(f.id==='share'&&!m.share)continue;
      cols.push({id:k+'_'+f.id,
        label:abbr(m)+(frames.length>1?(FRAME_SUFFIX[f.id]??' '+f.label):''),
        full:m.label+(frames.length>1?` — ${f.tip?f.tip[0]:f.label}`:''),
        block:f.block,metric:k,frame:f.id,fplcol:isFpl,
        fmt:f.id==='share'?'pct':f.id==='total'?'count':m.fmt,
        gap:false});
      first=false;
    }
  }
  for(const c of cols){
    if(!c.metric)continue;
    const g=M(c.metric).group;
    if(!famSeen.has(g)){famSeen.add(g);c.famgap=true;}
  }
  return cols;
}

function apply(rows){
  const q=norm(state.q);
  const out=rows.filter(r=>r.minutes>=state.minMinutes&&
    (!state.mpaMin||(r.min_per_app??0)>=state.mpaMin)&&
    (!q||norm(r.web_name).includes(q)||norm(fullName(r)).includes(q))&&
    (state.ageMin==null||(r.age!=null&&r.age>=state.ageMin))&&
    (state.ageMax==null||(r.age!=null&&r.age<=state.ageMax))&&
    (!state.pos.length||state.pos.includes(r.position))&&
    (!state.club.length||state.club.includes(r.team_name))&&
    (!state.nat.length||state.nat.includes(r.nationality)));
  if(state.rank)for(const k of activeStats()){
    const m=M(k),f=k+'_'+rankHost();
    const p=out.filter(r=>r[f]!=null).sort((a,b)=>(b[f]-a[f])*m.dir);
    p.forEach((r,i)=>{r[k+'_rank']=i+1;r[k+'_rankN']=p.length;});
    for(const r of out)if(r[f]==null){r[k+'_rank']=null;r[k+'_rankN']=null;}
  }
  const s=state.sort,isRank=s.endsWith('_rank');
  out.sort((a,b)=>{
    const x=a[s],y=b[s];
    if(x==null&&y==null)return 0;
    if(x==null)return 1;if(y==null)return -1;
    if(isRank)return x-y;
    if(typeof x==='string')return x.localeCompare(y);
    return y-x;});
  return out;
}

/* Average of whatever is currently on screen. Rates are pooled rather than
   averaged — sum the totals, divide by the summed minutes — so a big sample
   is not given the same weight as a small one. */
function averages(rows,cols){
  const out={};
  if(!rows.length)return out;
  const mean=f=>{const v=rows.map(f).filter(x=>x!=null&&!Number.isNaN(x));
    return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  for(const c of cols){
    if(c.type==='name'||c.type==='txt'||c.type==='rank'){out[c.id]=null;continue;}
    if(!c.metric){out[c.id]=mean(r=>r[c.id]);continue;}
    const k=c.metric;
    if(c.frame==='total'||c.frame==='adj90'||c.frame==='share'){out[c.id]=mean(r=>r[k+'_total']!=null?r[c.id]:null);continue;}
    let tot=0,den=0;
    for(const r of rows){
      const t=r[k+'_total'];if(t==null)continue;
      tot+=t;den+=c.frame==='p90'?r.minutes/90:(r.appearances||0);
    }
    out[c.id]=den>0?tot/den:null;
  }
  return out;
}

const fmt=(v,f)=>{
  if(v==null||Number.isNaN(v))return null;
  if(f==='count')return Number.isInteger(v)?v.toLocaleString():v.toFixed(2);
  if(f==='int')return Math.round(v).toLocaleString();
  if(f==='1dp')return v.toFixed(1);
  if(f==='pct')return (v*100).toFixed(1)+'%';
  return v.toFixed(2);
};
const suppressed=(c,r)=>FLOOR>0&&['p90','app','share'].includes(c.frame)&&r.minutes<FLOOR;

function tipFor(c){
  if(!c)return null;
  if(BASE_TIPS[c.id]){const[t,d]=BASE_TIPS[c.id];return{title:t,body:d,src:null};}
  const m=M(c.metric);if(!m)return null;
  const pv=provenance(m);
  if(c.frame==='rank')return{title:`${m.label} — ${RANK_TIP[0]}`,
    body:`${RANK_TIP[1]}<br><br>${m.desc||m.definition||''}${pv}`,src:null};
  const f=FR(c.frame);
  return{title:`${m.label} — ${f.tip[0]}`,
    body:`${f.tip[1]}<br><br>${m.desc||m.definition||''}${pv}`,src:null};
}

/* A key for the abbreviations currently on screen. Dense tables are only
   legible once the codes are learnable. */
function buildKey(cols){
  const host=document.getElementById('keystrip');
  if(!host)return;
  const seen=new Map();
  for(const c of cols){
    if(!c.metric)continue;
    const m=M(c.metric);if(!m)continue;
    if(!seen.has(m.key))seen.set(m.key,{a:abbr(m),full:m.label,m});
  }
  if(!seen.size||!state.showKey){
    host.innerHTML=seen.size
      ? `<button class="keytog" id="keyTog">Show key</button>`:'';
  }else{
    host.innerHTML=`<button class="keytog" id="keyTog" aria-pressed="true">Hide key</button>`+
      [...seen.values()].map(x=>
        `<span class="keyitem" data-help="${encodeURIComponent(
          (x.m.desc||x.m.definition||'')+provenance(x.m))}">`+
        `<b>${x.a}</b>${x.full}</span>`).join('');
    host.querySelectorAll('[data-help]').forEach(el=>{
      attachTip(el,{title:el.querySelector('b').textContent,
        body:decodeURIComponent(el.dataset.help),src:null});});
  }
  const t=document.getElementById('keyTog');
  if(t)t.onclick=()=>{state.showKey=!state.showKey;buildKey(cols);writeHash();};
  host.classList.toggle('empty',!seen.size);
}

/* Jump bar: one pill per metric family present in the current selection,
   scrolling the table horizontally to that family's first column. */
function buildJump(cols){
  const host=document.getElementById('jumpbar');
  if(!host)return;
  const seen=new Map();
  for(const c of cols){
    if(!c.metric)continue;
    const m=M(c.metric);if(!m)continue;
    if(!seen.has(m.group))seen.set(m.group,c.id);
  }
  const wrap=document.getElementById('tablewrap');
  const overflows=wrap&&wrap.scrollWidth-wrap.clientWidth>120;
  if(seen.size<2||!overflows){host.innerHTML='';host.classList.add('empty');return;}
  host.classList.remove('empty');
  host.innerHTML=`<span class="lbl">Jump to</span>`+
    [...seen].map(([g,id])=>
      `<button class="jump ${CC[g]||''}" data-jump="${id}">${g}</button>`).join('')+
    ``;
  host.querySelectorAll('[data-jump]').forEach(b=>{
    b.onclick=()=>{
      const th=document.querySelector(`th[data-col="${b.dataset.jump}"]`);
      const wrap=document.getElementById('tablewrap');
      if(!th||!wrap)return;
      const frozen=FRZ_W.reduce((a,x)=>a+x,0);
      wrap.scrollTo({left:th.offsetLeft-frozen-8,behavior:'smooth'});};});
}

function render(){
  try{ renderInner(); }
  catch(err){
    console.error('render',err);

    if(t)t.innerHTML='';
    if(e){e.hidden=false;
      e.innerHTML='<b>Render failed.</b> '+(err&&err.message||err)+
        ' <button class="clear" id="rfix">Reset metrics</button>';
      const b=document.getElementById('rfix');
      if(b)b.onclick=()=>{state.off=[];state.extra=[];state.tab='Attacking';
        buildTabs();buildFrames();render();};}

function renderInner(){
  const rows=apply(aggregate()),cols=columns();
  const listed=rows.filter(r=>!state.pins.includes(r.player_code)).length;
  const pages=Math.max(1,Math.ceil(listed/PAGE));
  state.page=Math.min(state.page,pages-1);
  if(!cols.some(c=>c.id===state.sort))state.sort='minutes';

  /* The band above the columns names the METRIC FAMILY, not the frame — the
     family is what you need to locate yourself, and the frame is already in
     each column label whenever more than one is showing. */
  const grp=[];
  for(const c of cols){
    const m=c.metric?M(c.metric):null;
    const fam=m?m.group:(c.block==='id'?'__id':'__av');
    const last=grp[grp.length-1];
    if(last&&last.fam===fam)last.span++;
    else grp.push({fam,span:1,first:c.id});
  }
  const FAMNAME={__id:'',__av:'Availability'};
  const thead=document.getElementById('thead');
  thead.innerHTML='<tr class="blocks">'+grp.map((g,i)=>{
    const known=!g.fam.startsWith('__');
    const cls=[known?'fam '+(KC[g.fam]||''):'',g.fam==='__av'?'avband':'',
      i===0?'name frz frzspan':'',i>0?'famgap':''].filter(Boolean).join(' ');
    const st=i===0?` style="${frzStyle(0)}"`:'';
    return `<th colspan="${g.span}" class="${cls}"${st}>`+
      `${known?g.fam:FAMNAME[g.fam]}</th>`;}).join('')+
    '</tr><tr class="labels">'+cols.map(c=>{
    const m=c.metric?M(c.metric):null;
    const famStart=grp.some(g=>g.first===c.id&&!g.fam.startsWith('__'));
    const cls=[c.block==='id'?'':c.block,c.fplcol?'fplcol':'',c.type==='name'?'name':'',
      c.gap?'gap':'',famStart?'famgap':'',state.sort===c.id?'sorted':'',
      m?KC[m.group]:'k-base'].filter(Boolean).join(' ')+frzCls(c);
    const st=c.frz!=null?` style="${frzStyle(c.frz)}"`:'';
    return `<th data-col="${c.id}" class="${cls}"${st} `+
      `title="${c.full||c.label}">${c.label}</th>`;
  }).join('')+'</tr>';

  const tbody=document.getElementById('tbody'),empty=document.getElementById('empty');
  const cell=(c,r)=>{
    const m=c.metric?M(c.metric):null;
    const cls=[c.block==='id'?'':c.block,c.fplcol?'fplcol':'',c.gap?'gap':'',
      c.famgap?'famgap':'',state.sort===c.id?'sortcol':''].filter(Boolean).join(' ')+frzCls(c);
    const fs=c.frz!=null?` style="${frzStyle(c.frz)}"`:'';
    if(c.type==='name'){
      const on=state.pins.includes(r.player_code);
      return `<td class="name ${cls}"${fs}><button class="pin${on?' on':''}" data-pin="${r.player_code}" `+
        `title="${on?'Unpin':'Pin to top'}">${on?'★':'☆'}</button>${r.web_name}`+
        `${r.moved?'<span class="moved">moved</span>':''}</td>`;}
    if(c.type==='txt'){
      if(c.id==='team_name')return `<td class="txt ${cls} club"${fs} title="${r.team_name??''}">`+
        `${clubBar(r.team_name)}${r.team_name??'—'}</td>`;
      return `<td class="txt ${cls} ${c.cls||''}"${fs}>${r[c.id]??'—'}</td>`;}
    if(c.type==='rank'){
      const v=r[c.id],n=r[c.id+'N'];
      if(v==null)return `<td class="${cls} nil"${fs}>—</td>`;
      return `<td class="${cls} rank${v<=10?' top '+KC[m.group]:''}"${fs}>${v}<span class="den"> / ${n}</span></td>`;}
    const s=suppressed(c,r)?null:fmt(r[c.id],c.fmt);
    if(s==null)return `<td class="${cls} nil"${fs}>—</td>`;
    let rk='';
    if(state.rank&&c.metric&&c.frame===rankHost()){
      const v=r[c.metric+'_rank'],n=r[c.metric+'_rankN'];
      if(v!=null)rk=`<span class="trk" title="rank ${v} of ${n} in the current filter">(${v})</span>`;

    empty.innerHTML='No players match these filters. <button class="clear" id="ci">Clear filters</button>';
    document.getElementById('ci').onclick=clearFilters;
  }else{
    empty.hidden=true;
    const avg=averages(rows,cols);
    const avgRow='<tr class="avg">'+cols.map(c=>{
      const cls=[c.block==='id'?'':c.block,c.fplcol?'fplcol':'',c.gap?'gap':'',
        c.famgap?'famgap':'',state.sort===c.id?'sortcol':''].filter(Boolean).join(' ')+frzCls(c);
      const fs=c.frz!=null?` style="${frzStyle(c.frz)}"`:'';

    const body=rows.filter(r=>!state.pins.includes(r.player_code))
      .slice(state.page*PAGE,state.page*PAGE+PAGE).map(r=>
      `<tr data-code="${r.player_code}"${state.sel===r.player_code?' class="sel"':''}>`+
      cols.map(c=>cell(c,r)).join('')+'</tr>').join('');

    tbody.querySelectorAll('tr[data-code]').forEach(tr=>{

      b.onclick=e=>{
        e.stopPropagation();
        const c=+b.dataset.pin,i=state.pins.indexOf(c);
        if(i>=0)state.pins.splice(i,1);else state.pins.push(c);
        render();};});
  }

  document.getElementById('count').textContent=`${rows.length.toLocaleString()} player${rows.length===1?'':'s'}`;
  document.getElementById('pagepos').textContent=`${state.page+1} / ${pages}`;
  document.getElementById('prev').disabled=state.page===0;
  document.getElementById('next').disabled=state.page>=pages-1;
  const sr=seasonsInRange(),all=allSeasons();
  const contiguous=sr.length===1||
    all.indexOf(sr[sr.length-1])-all.indexOf(sr[0])===sr.length-1;
  document.getElementById('scope').textContent=
    sr.length===1?sr[0]:contiguous?`${sr[0]}–${sr[sr.length-1]}`:`${sr.length} seasons`;

  requestAnimationFrame(()=>buildJump(cols));
  buildKey(cols);
  const byId=Object.fromEntries(cols.map(c=>[c.id,c]));
  thead.querySelectorAll('th[data-col]').forEach(th=>{
    th.onclick=()=>{state.sort=th.dataset.col;state.page=0;render();};
    const t=tipFor(byId[th.dataset.col]);
    if(t){th.onmouseenter=e=>showTip(e,t);th.onmousemove=moveTip;th.onmouseleave=hideTip;}});
  writeHash();
}

function openDrawer(code){
  if(!optaLoaded.has(seasonsInRange()[0]))
    ensureOpta().then(ok=>{if(ok&&state.sel===code)openDrawer(code);});
  try{ openDrawerInner(code); }
  catch(err){
    console.error('drawer',err);
    const b=document.getElementById('dBody');
    if(b)b.innerHTML='<div class="dsec s-base"><h3>Something broke</h3>'+
      '<div class="lmsg">'+(err&&err.message||err)+'</div></div>';
  }
}
function openDrawerInner(code){

      p.moved?'changed club in range':null].filter(Boolean);
    return `<div class="dfig">${figure(p)}</div><div class="dtext">`+
      `<h2>${fn}${fn!==p.web_name?`<span class="dalias">${p.web_name}</span>`:''}</h2>`+
      `<div class="meta">${clubBar(p.team_name,true)}${p.team_name} · ${bits.join(' · ')}</div>`+

  const slot=two
    ? `<button class="slotbtn rm" id="cmpBtn" data-cmp="0" `+
      `title="Click to remove from the comparison">${ident(cmpR)}</button>`
    : `<button class="slotbtn ghost" id="cmpBtn" title="Add a player to compare">`+
      `<span class="dfig"><span class="halo gh"><span class="plus">+</span></span></span>`+
      `<span class="dtext"><span class="gname">Add player</span>`+
      `<span class="gmeta">— · — · —</span></span></button>`;

  document.getElementById('dHead').innerHTML=
    `<div class="dpanes"><div class="pane a">${ident(r)}</div>`+
    `${two?'<span class="vs">VS</span>':''}`+
    `<div class="pane b ms cmpms${two?' cmping':''}" id="cmpMs">${slot}`+
    `<div class="ms-panel"><input class="ms-search" id="cmpSearch" `+
    `placeholder="Search any player…"><div class="ms-list" id="cmpList"></div></div></div></div>`+
    `<button class="dclose" id="dClose" title="Close (Esc)">&times;</button>`;

  document.getElementById('dClose').onclick=closeDrawer;
  document.querySelectorAll('[data-cmp]').forEach(b=>{
    b.onclick=()=>{
      const c=+b.dataset.cmp;
      state.cmp=(c===0||state.cmp===c)?null:c;
      openDrawer(code);};});
  {
    const host=document.getElementById('cmpMs');
    const btn=document.getElementById('cmpBtn'),panel=host.querySelector('.ms-panel');
    const search=document.getElementById('cmpSearch'),list=document.getElementById('cmpList');
    const all=aggregate().filter(x=>x.player_code!==code&&x.minutes>0)
      .sort((x,y)=>y.minutes-x.minutes);
    const paint=q=>{
      const nq=norm(q);
      const hits=(nq?all.filter(x=>norm(x.web_name).includes(nq)||norm(fullName(x)).includes(nq))
        :all).slice(0,60);
      list.innerHTML=hits.length?hits.map(x=>
        `<button class="ms-opt pbtn" data-pick="${x.player_code}">${clubBar(x.team_name)}`+
        `<span class="lbl">${x.web_name}</span>`+
        `<span class="pmeta">${x.position} · ${fmt(x.minutes,'int')}'</span></button>`).join('')
        :'<div class="ms-none">No player matches.</div>';
      list.querySelectorAll('[data-pick]').forEach(b=>{
        b.onclick=e=>{e.stopPropagation();state.cmp=+b.dataset.pick;openDrawer(code);};});
    };
    if(!two)btn.onclick=e=>{
      e.stopPropagation();
